name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # Runs once daily at 3 AM UTC
  workflow_dispatch: # Lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nord&border_color=0FBF3E&title_color=0FBF3E&text_color=B6BFB8&icon_color=0FBF3E&bg_color=0D1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=nord&border_color=0FBF3E&title_color=0FBF3E&text_color=B6BFB8&bg_color=0D1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate AQI Predictor pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=maham-bhatti&repo=aqi-predictor&theme=nord&border_color=0FBF3E&title_color=0FBF3E&text_color=B6BFB8&bg_color=0D1117
          path: profile/pin-aqi-predictor.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate FYP Traffic pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=maham-bhatti&repo=FYP-Traffic&theme=nord&border_color=0FBF3E&title_color=0FBF3E&text_color=B6BFB8&bg_color=0D1117
          path: profile/pin-fyp-traffic.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=0D1117&border=0FBF3E&ring=0FBF3E&fire=0FBF3E&currStreakLabel=B6BFB8
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
